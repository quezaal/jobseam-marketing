<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">How JobSeam connects the work</title><desc id="desc">Opportunities and talent enter a shared workspace for matching, applications, placements, employment, authorization and documents. Recruiters, consultants and administrators work through their permitted roles. Illustrative overview, not a live screenshot.</desc><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1200" height="570" rx="0" fill="#f1f5f8" stroke="none"/><text x="38" y="50" fill="#17334c" font-size="32" font-weight="700">How JobSeam connects the work</text><text x="38" y="82" fill="#536b7e" font-size="18" font-weight="400">Illustrative system overview. Not a live application screenshot.</text><rect x="35" y="112" width="255" height="325" rx="16" fill="#fff" stroke="#d7e2ea"/><text x="57" y="150" fill="#668b35" font-size="20" font-weight="700">BRING IT IN</text><text x="57" y="190" fill="#17334c" font-size="22" font-weight="700">Opportunities</text><text x="57" y="219" fill="#536b7e" font-size="15" font-weight="400">Boards · company sites · email</text><text x="57" y="275" fill="#17334c" font-size="22" font-weight="700">Talent</text><text x="57" y="304" fill="#536b7e" font-size="15" font-weight="400">Resume · ZIP · roster · direct</text><text x="57" y="360" fill="#17334c" font-size="22" font-weight="700">Connected sources</text><text x="57" y="389" fill="#536b7e" font-size="15" font-weight="400">Email · WhatsApp, when enabled</text><rect x="325" y="112" width="550" height="325" rx="16" fill="#17334c" stroke="#17334c"/><text x="350" y="152" fill="#b6d58a" font-size="20" font-weight="700">THE SHARED WORKSPACE</text><text x="350" y="194" fill="white" font-size="25" font-weight="700">People + opportunities</text><text x="350" y="225" fill="#c6d8e5" font-size="20" font-weight="400">Profiles · requirements · matching</text><text x="350" y="279" fill="white" font-size="25" font-weight="700">The next step</text><text x="350" y="310" fill="#c6d8e5" font-size="20" font-weight="400">Applications · interviews · placements</text><text x="350" y="364" fill="white" font-size="25" font-weight="700">The ongoing relationship</text><text x="350" y="395" fill="#c6d8e5" font-size="20" font-weight="400">Employment · documents · authorization</text><rect x="910" y="112" width="255" height="325" rx="16" fill="#fff" stroke="#d7e2ea"/><text x="932" y="150" fill="#668b35" font-size="20" font-weight="700">WORK TOGETHER</text><text x="932" y="190" fill="#17334c" font-size="21" font-weight="700">Recruiters + HR</text><text x="932" y="219" fill="#536b7e" font-size="15" font-weight="400">Review, coordinate and record</text><text x="932" y="275" fill="#17334c" font-size="21" font-weight="700">Consultants</text><text x="932" y="304" fill="#536b7e" font-size="15" font-weight="400">Confirm details and contribute</text><text x="932" y="360" fill="#17334c" font-size="21" font-weight="700">Administrators</text><text x="932" y="389" fill="#536b7e" font-size="15" font-weight="400">Set access and configuration</text><path d="M300 267h15m-6-6 6 6-6 6" fill="none" stroke="#6d9237" stroke-width="3"/><path d="M885 267h15m-6-6 6 6-6 6" fill="none" stroke="#6d9237" stroke-width="3"/><rect x="35" y="463" width="1130" height="65" rx="16" fill="#e9f1df" stroke="#cbdab6"/><text x="65" y="503" fill="#3f6024" font-size="26" font-weight="700">Collect   →   Review   →   Match   →   Submit   →   Place   →   Manage</text><text x="38" y="554" fill="#536b7e" font-size="16" font-weight="400">A Quezaal Inc. product  •  jobseam.com  •  Feature availability depends on configuration.</text></g></svg>