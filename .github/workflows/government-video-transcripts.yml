name: Prepare government news and transcripts
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * *'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install caption and transcription tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r scripts/transcript-requirements.txt
      - uses: actions/cache@v4
        with:
          path: assets/transcripts/
          key: government-transcripts-${{ github.run_id }}
          restore-keys: government-transcripts-
      - name: Discover and process up to five new government videos
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/process-video-transcripts.py --limit 5
      - name: Refresh publication snapshot
        run: python scripts/refresh-immigration-news.py
      - name: Verify and build
        run: |
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'
          python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: jobseam-site-with-transcripts
          path: _site/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: government-transcript-data
          path: assets/transcripts/
          retention-days: 30
