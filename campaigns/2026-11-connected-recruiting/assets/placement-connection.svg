<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">The candidate, opportunity and placement connection</title><desc id="desc">A candidate on the left and an opportunity on the right connect through placement in the center. The consulting team reviews and coordinates the work. JobSeam supports intake, matching, records, follow up and access controls. Illustrative workflow, not a guaranteed outcome.</desc><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1400" height="760" rx="0" fill="#f4f7fa" stroke="none"/><text x="48" y="65" font-size="43" fill="#17334c" font-weight="700">The right person. The right opportunity.</text><text x="48" y="110" font-size="26" fill="#526b7f" font-weight="400">The consulting team builds the connection. JobSeam supports the work around it.</text><rect x="45" y="160" width="370" height="340" rx="20" fill="#fff" stroke="#d7e2ea"/><rect x="515" y="160" width="370" height="340" rx="20" fill="#17334c" stroke="#17334c"/><rect x="985" y="160" width="370" height="340" rx="20" fill="#fff" stroke="#d7e2ea"/><circle cx="95" cy="209" r="16" fill="#7d9f45"/><path d="M69 254q0-27 26-27t26 27" fill="#7d9f45"/><rect x="1014" y="196" width="48" height="38" rx="5" fill="none" stroke="#7d9f45" stroke-width="4"/><path d="M1027 196v-10h22v10m-35 25h48" fill="none" stroke="#7d9f45" stroke-width="4"/><text x="137" y="222" font-size="22" fill="#587b31" font-weight="700">THE CANDIDATE</text><text x="75" y="295" font-size="26" fill="#17334c" font-weight="700">Skills. Experience. Plans.</text><text x="75" y="340" font-size="24" fill="#17334c" font-weight="400">What can I bring?</text><text x="75" y="381" font-size="24" fill="#17334c" font-weight="400">What work fits my goals?</text><text x="75" y="451" font-size="18" fill="#526b7f" font-weight="400">Profile and document permissions</text><text x="1081" y="222" font-size="20" fill="#587b31" font-weight="700">THE OPPORTUNITY</text><text x="1015" y="295" font-size="26" fill="#17334c" font-weight="700">A role. A need. A client.</text><text x="1015" y="340" font-size="24" fill="#17334c" font-weight="400">What does this role need?</text><text x="1015" y="381" font-size="24" fill="#17334c" font-weight="400">Who could be a good fit?</text><text x="1015" y="451" font-size="18" fill="#526b7f" font-weight="400">Review and sharing controls</text><text x="555" y="223" font-size="34" fill="#c6e5a1" font-weight="700">PLACEMENT</text><text x="550" y="277" font-size="19" fill="white" font-weight="400">The connection your team builds.</text><circle cx="674" cy="332" r="27" fill="none" stroke="#b9d893" stroke-width="4"/><circle cx="711" cy="332" r="27" fill="none" stroke="#cbddec" stroke-width="4"/><text x="550" y="401" font-size="22" fill="white" font-weight="400">Review. Coordinate.</text><text x="550" y="434" font-size="22" fill="white" font-weight="400">Follow through.</text><text x="550" y="474" font-size="19" fill="#cbddec" font-weight="400">People make the decisions.</text><path d="M437 323h53m-13-12 13 12-13 12" fill="none" stroke="#7d9f45" stroke-width="5"/><path d="M961 323h-53m13-12-13 12 13 12" fill="none" stroke="#7d9f45" stroke-width="5"/><rect x="45" y="535" width="1310" height="147" rx="20" fill="#eaf1e0" stroke="#cbdcb5"/><text x="75" y="579" font-size="25" fill="#486d28" font-weight="700">JOBSEAM</text><text x="270" y="579" font-size="28" fill="#17334c" font-weight="700">Less chasing. More context. A record of the work.</text><text x="75" y="630" font-size="24" fill="#17334c" font-weight="400">Intake and matching     •     Applications and follow up     •     Roles, permissions and access history</text><text x="48" y="722" font-size="20" fill="#526b7f" font-weight="400">Illustrative workflow. Controls depend on configuration. Not a placement or security guarantee.</text></g></svg>